# News Agent 配置文件
# 编辑后无需重启，每次跑都会重新读

# ---------- 每周排期 ----------
# 按 weekday 把每天绑到一个板块,只抓该板块的关键词、只让 scorer 关心该板块
# weekday: 0=周一, 1=周二, 2=周三, 3=周四, 4=周五, 5=周六, 6=周日
# 不在表里的日子直接退出(GitHub Actions 当日跑空就行)
schedule:
  weekday_category:
    0: governance   # 周一: AI 治理
    2: data         # 周三: AI 数据
    4: industry     # 周五: AI 行业落地
    6: agent        # 周日: AI Agent 动态

# ---------- 推送配置 ----------
push:
  # 单次推送的文章数上限（Claude 摘要的 token 成本主要来自这里）
  max_articles: 20
  # 单条新闻的相关性分数阈值（0-10），低于此分不推送
  min_score: 6.0
  # PushPlus 推送主题模板（{category_label} 会被替换）
  title_template: "{category_label}一周新闻汇总"

# ---------- 板块展示名 ----------
# 用于推送标题、正文标题、日志
category_labels:
  governance: "AI治理"
  data: "AI数据"
  industry: "AI行业"
  agent: "AI Agent"

# ---------- DeepSeek API 配置 ----------
deepseek:
  scorer_model: "deepseek-chat"
  summarizer_model: "deepseek-chat"
  scorer_batch_size: 20

# ---------- Google News 关键词搜索 ----------
# 按板块分组,当日只抓当日板块对应的 queries
# 搜索窗口固定 24h,避免推荐过期内容
google_news_queries:
  governance:
    - "EU AI Act"
    - "AI regulation"
    - "AI safety institute"
    - "AI alignment"
    - "AI 监管"
    - "生成式人工智能管理办法"
    - "AI 治理标准"
    - "ISO 42001"
    - "NIST AI RMF"

  data:
    - "AI capex"
    - "AI data center"
    - "AI training data"
    - "AI 算力"
    - "数据要素市场"
    - "数据资产入表"
    - "synthetic training data"
    - "vector database RAG"

  industry:
    - "AI 行业落地"
    - "行业大模型"
    - "AI 数字员工"
    - "AI 智能客服"
    - "AIGC 企业应用"
    - "智慧办公 AI"
    - "行业智能化"
    - "enterprise AI deployment"
    - "AI digital worker"

  agent:
    - "AI Agent"
    - "agentic AI"
    - "multi-agent"
    - "coding agent"
    - "Claude Code"
    - "Cursor AI"
    - "Devin AI"
    - "OpenAI Codex"
    - "MCP protocol"
    - "computer use AI"
    - "AI Agent 产品"
    - "Agent 框架"

# ---------- 直接订阅的 RSS 源 ----------
# 这里全是综合型 AI 媒体,每天都抓;由 scorer 判断与当日板块是否相关
rss_feeds:
  # 中文科技/AI 媒体
  - name: "36氪 AI"
    url: "https://36kr.com/feed-newsflash"
  # 机器之心 RSS 已下线(302→不合法XML),靠 Google News query "机器之心" 兜底
  # - name: "机器之心"
  #   url: "https://www.jiqizhixin.com/rss"
  - name: "量子位"
    url: "https://www.qbitai.com/feed"

  # 英文 AI/产业媒体
  - name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - name: "MIT Tech Review AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
  - name: "VentureBeat AI"
    url: "https://venturebeat.com/category/ai/feed/"

  # 模型/治理一手源
  # Anthropic News RSS 路径已变(原 /news/rss.xml 是 404),靠 Google News 兜底
  # - name: "Anthropic News"
  #   url: "https://www.anthropic.com/news/rss.xml"
  - name: "OpenAI Blog"
    url: "https://openai.com/news/rss.xml"
  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/blog/rss.xml"
  - name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"

# ---------- RSSHub 路由（用于 X / 微信公众号）----------
rsshub:
  instance: "https://rsshub.app"
  routes: []
  # - name: "Sam Altman X"
  #   path: "/twitter/user/sama"

# ---------- 源采集配置 ----------
sources:
  # 文章发布时间窗口（小时）。早于此窗口的丢弃。
  # OpenAI / HuggingFace / DeepMind 等 RSS 不分页,会返回全量历史,必须靠这个收口。
  # 缺 published_at 的文章会保留(避免误杀)。
  # 每周推送一次,所以窗口设为 7 天
  max_age_hours: 168

# ---------- 去重配置 ----------
state:
  # 已推送文章记录保留天数（防止反复推同一篇）
  retention_days: 30
