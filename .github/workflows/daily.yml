name: Daily News Push

on:
  # 唯一定时入口：GitHub Actions schedule（云端托管，本机无需开机）。
  # 北京 12:00 正值 GitHub 高峰，schedule 可能延迟数小时（2026-10-11/18/19/21 实测），
  # 由逐小时补跑与兜底梯队收敛。
  schedule:
    # 主梯队：北京时间周一/三/五/日 12:00 = UTC 同日 04:00。
    # GitHub 整点 schedule 在高峰期可能延迟数小时甚至整个跳过
    # （2026-10-11 延迟 6.5h，2026-10-12 未触发，2026-10-18 主梯队缺席，2026-10-21 拖到 17:11），
    # 故加 12:30–15:30（UTC 04:30–07:30）逐小时补跑梯队与 16:30（UTC 08:30）兜底梯队；
    # 补跑/兜底运行带 --skip-if-ran-today，当日已有产物时静默跳过，保证一天只推一次。
    # 运行时 TZ=Asia/Shanghai，main.py 按北京时间 weekday 选择板块。
    - cron: '0 4 * * 1,3,5,0'
    - cron: '30 4,5,6,7 * * 1,3,5,0'
    - cron: '30 8 * * 1,3,5,0'
  workflow_dispatch:  # 允许手动触发(在 Actions 页面)
    inputs:
      test_push:
        description: '只测试推送(不抓新闻)'
        type: boolean
        default: false
      category:
        description: '手动指定板块(忽略 weekday 排期)'
        type: choice
        options:
          - ''
          - governance
          - data
          - industry
          - terminal

permissions:
  contents: write  # 需要写权限,跑完要 commit state/sent.json 回去

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # state 文件若在合并时带入了冲突标记，JSON 解析会失败；代码里会静默清空去重
      # 历史（只留 warning），导致全量重推已推送过的新闻。这里提前校验，坏了直接红 X。
      - name: Validate state files
        run: |
          python - <<'PY'
          import json, pathlib
          for p in ("state/sent.json", "state/events.json"):
              path = pathlib.Path(p)
              if path.exists():
                  json.loads(path.read_text("utf-8"))
                  print(f"{p}: OK")
          PY

      - name: Run news agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # workflow_dispatch 走 inputs
          CATEGORY: ${{ github.event.inputs.category }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
        run: |
          if [[ -n "$CATEGORY" ]]; then
            python -m news_agent.main --category "$CATEGORY"
          elif [[ "$TEST_PUSH" == "true" ]]; then
            python -m news_agent.main --test-push
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python -m news_agent.main  # 手动触发不受当日守卫影响
          else
            # schedule 全部梯队均为自动档：带当日守卫，当日已推送过则静默跳过，
            # 一天最多推一次。
            python -m news_agent.main --skip-if-ran-today
          fi

      - name: Commit updated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/ output/)" ]]; then
            git add state/
            [[ -d output ]] && git add output/
            git commit -m "chore: news output $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no state/output change to commit"
          fi
