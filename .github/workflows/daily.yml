name: Daily News Push

on:
  schedule:
    # 周一/三/五北京时间 08:00；GitHub Actions cron 使用 UTC 且 1=Mon、3=Wed、5=Fri。
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:  # 允许手动触发(在 Actions 页面)
    inputs:
      test_push:
        description: '只测试推送(不抓新闻)'
        type: boolean
        default: false
      category:
        description: '手动指定板块(忽略 weekday 排期)'
        type: choice
        options:
          - ''
          - governance
          - data
          - industry
          - agent
          - wechat-and-website

permissions:
  contents: write  # 需要写权限,跑完要 commit state/sent.json 回去

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          ARGS=""
          CATEGORY="${{ github.event.inputs.category }}"
          # 下拉里的 "wechat-and-website" 对应脚本的 wechat 板块(同时抓公众号+官网)
          if [[ "$CATEGORY" == "wechat-and-website" ]]; then
            CATEGORY="wechat"
          fi
          if [[ "${{ github.event.inputs.test_push }}" == "true" ]]; then
            ARGS="--test-push"
          elif [[ -n "$CATEGORY" ]]; then
            ARGS="--category $CATEGORY"
          fi
          python -m news_agent.main $ARGS

      - name: Commit updated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/ output/)" ]]; then
            git add state/
            [[ -d output ]] && git add output/
            git commit -m "chore: news output $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no state/output change to commit"
          fi
