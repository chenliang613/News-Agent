name: Daily News Push

on:
  workflow_dispatch:  # 允许手动触发(在 Actions 页面)
    inputs:
      test_push:
        description: '只测试推送(不抓新闻)'
        type: boolean
        default: false
      category:
        description: '手动指定板块(忽略 weekday 排期)'
        type: choice
        options:
          - ''
          - governance
          - data
          - industry

permissions:
  contents: write  # 需要写权限,跑完要 commit state/sent.json 回去

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CATEGORY: ${{ github.event.inputs.category }}
        run: |
          if [[ -n "$CATEGORY" ]]; then
            python -m news_agent.main --category "$CATEGORY"
          elif [[ "${{ github.event.inputs.test_push }}" == "true" ]]; then
            python -m news_agent.main --test-push
          else
            python -m news_agent.main
          fi

      - name: Commit updated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/ output/)" ]]; then
            git add state/
            [[ -d output ]] && git add output/
            git commit -m "chore: news output $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no state/output change to commit"
          fi
