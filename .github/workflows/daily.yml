name: Daily News Push

on:
  # GitHub Actions schedule 使用 UTC，北京时间为 UTC+8。
  schedule:
    # 北京时间周一/三/五/日 08:00 执行。
    # 优先在 10:00 前补跑：08:17/37/57、09:17/37。
    # 12:30 保留最后兜底，避免上午触发全部延迟时整日漏报。
    # 各梯队带 --skip-if-ran-today，保证一天最多推送一次。
    - cron: '0 0 * * 1,3,5,0'
    - cron: '17,37,57 0 * * 1,3,5,0'
    - cron: '17,37 1 * * 1,3,5,0'
    - cron: '30 4 * * 1,3,5,0'
  workflow_dispatch:  # 允许手动触发(在 Actions 页面)
    inputs:
      test_push:
        description: '只测试推送(不抓新闻)'
        type: boolean
        default: false
      category:
        description: '手动指定板块(忽略 weekday 排期)'
        type: choice
        options:
          - ''
          - governance
          - data
          - industry
          - terminal

permissions:
  contents: write  # 需要写权限,跑完要 commit state/sent.json 回去

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 扩展检索安装失败不阻断 RSS / Google News 主流程。
      - name: Install Agent Reach
        continue-on-error: true
        run: |
          python -m pip install uv
          uv tool install 'https://github.com/Panniantong/Agent-Reach/releases/latest/download/agent-reach.zip'
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agent-reach version

      # state 文件若在合并时带入了冲突标记，JSON 解析会失败；代码里会静默清空去重
      # 历史（只留 warning），导致全量重推已推送过的新闻。这里提前校验，坏了直接红 X。
      - name: Validate state files
        run: |
          python - <<'PY'
          import json, pathlib
          for p in ("state/sent.json", "state/events.json"):
              path = pathlib.Path(p)
              if path.exists():
                  json.loads(path.read_text("utf-8"))
                  print(f"{p}: OK")
          PY

      - name: Run news agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # workflow_dispatch 走 inputs
          CATEGORY: ${{ github.event.inputs.category }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
        run: |
          if [[ -n "$CATEGORY" ]]; then
            python -m news_agent.main --category "$CATEGORY"
          elif [[ "$TEST_PUSH" == "true" ]]; then
            python -m news_agent.main --test-push
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python -m news_agent.main  # 手动触发不受当日守卫影响
          else
            # schedule 全部梯队均为自动档：带当日守卫，当日已推送过则静默跳过，
            # 一天最多推一次。
            python -m news_agent.main --skip-if-ran-today
          fi

      - name: Commit updated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state/ output/)" ]]; then
            git add state/
            [[ -d output ]] && git add output/
            git commit -m "chore: news output $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no state/output change to commit"
          fi
