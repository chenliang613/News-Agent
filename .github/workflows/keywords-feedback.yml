name: Weekly Keyword Feedback Proposal

on:
  schedule:
    # 周六北京时间 07:20；GitHub Actions cron 使用 UTC。
    - cron: '20 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: weekly-keyword-feedback
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect trusted Issue Form feedback
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m news_agent.keyword_feedback collect \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" --out /tmp/feedback.json | tee /tmp/collect.log
          echo "count=$(sed -n 's/^count=//p' /tmp/collect.log)" >> "$GITHUB_OUTPUT"

      - name: Generate constrained proposal
        if: steps.feedback.outputs.count != '0'
        id: proposal
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m news_agent.keyword_feedback propose \
            --feedback /tmp/feedback.json --out /tmp/proposal.json --api-key "$DEEPSEEK_API_KEY" | tee /tmp/proposal.log
          echo "categories=$(sed -n 's/^categories=//p' /tmp/proposal.log)" >> "$GITHUB_OUTPUT"

      - name: Apply constrained proposal
        if: steps.proposal.outputs.categories != '0'
        run: |
          python -m news_agent.keyword_feedback apply \
            --keywords keywords.md --proposal /tmp/proposal.json --out keywords.md

      - name: Create review PR
        if: steps.proposal.outputs.categories != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_REFS=$(python -c 'import json; print(" ".join(f"Closes #{x[\"number\"]}" for x in json.load(open("/tmp/feedback.json"))))')
          BRANCH="automation/keyword-feedback-${{ github.run_id }}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.md
          git commit -m "chore: propose keyword feedback adjustments"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: weekly keyword feedback proposal" \
            --body "Automated candidate changes from trusted Issue Form feedback. Review before merging.\n\n${ISSUE_REFS}"
